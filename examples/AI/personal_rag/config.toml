# Конфигурация простой RAG-системы.
#
# Пути разрешаются относительно этого файла, «~» раскрывается домашним
# каталогом. Значения можно переопределить переменными окружения
# (RAG_CATALOG_DIR, RAG_STORE_DIR, RAG_BASE_URL, RAG_MODEL, RAG_API_KEY,
# RAG_LOG_FILE) — приоритет у окружения.

[catalog]
# Где лежат документы. Внутри могут быть симлинки на другие каталоги —
# это способ подключить чужие подкаталоги без копирования.
dir = "catalog"
# Заходить ли в симлинки-подкаталоги при обходе.
follow_symlinks = true

[store]
# Где хранить sqlite-базу с векторами и полнотекстовым индексом.
dir = "data"

[embedding]
# Локальная модель эмбеддингов (ONNX, работает на CPU, качается один раз
# при первом запуске в cache_dir, дальше берётся из кэша).
# Размерность модели (384) фиксируется в базе при её создании —
# менять модель на другую размерность без пересоздания базы нельзя.
model = "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
cache_dir = ".model_cache"

[llm]
# Дешёвая модель для /ask — OpenAI-совместимый API.
base_url = "https://routerai.ru/api/v1"
model = "inclusionai/ling-3.0-flash"
# Файл с ключом, человекоредактируемый (формат KEY=значение, см. keys.env.example).
# В нём должна быть строка вида RAG_API_KEY=sk-...
key_file = "keys.env"
timeout = 60
# Бюджет токенов на ответ. Модель reasoning: сначала тратит токены на
# размышление, и только потом пишет ответ, — бюджет общий на обе фазы.
# Малое значение даёт finish_reason="length" и пустой ответ, поэтому
# здесь запас на размышление.
max_tokens = 2000
# Потолок бюджета для одного повтора, когда ответ обрезался по длине.
max_tokens_limit = 8000
temperature = 0.2

[search]
# Веса сторон в гибридном поиске: kNN по векторам и BM25 по леммам.
# RRF не требует калибровки, но веса позволяют сдвинуть баланс.
vector_weight = 1.0
bm25_weight = 1.0
# Сколько кандидатов берёт каждая сторона до слияния.
candidates = 40
# Порог косинусного расстояния: дальше кандидатов не берём. kNN всегда
# возвращает k ближайших векторов, даже для бессмысленного запроса, —
# порог отсекает явный мусор. По замерам на этом каталоге релевантные
# запросы дают 0.35–0.74, нерелевантные — от 0.8.
max_distance = 0.8
# Максимальный размер чанка в символах.
chunk_chars = 1200

[service]
# Журнал сервиса (пусто — только терминал). Относительный путь.
log_file = "rag_service.log"
